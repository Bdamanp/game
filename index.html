<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Territory War</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #0d1117;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: #fff;
  padding: 16px;
  user-select: none;
  -webkit-user-select: none;
}
h1 {
  font-size: clamp(1.3rem, 6vw, 2rem);
  font-weight: 900;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  background: linear-gradient(135deg, #f1f5f9, #94a3b8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 2px;
}
.sub {
  font-size: clamp(0.62rem, 2.2vw, 0.78rem);
  color: #374151;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 14px;
}
#canvas {
  display: block;
  border-radius: 50%;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 0 80px rgba(0,0,0,0.6);
}
#msg {
  height: 28px;
  margin: 10px 0 6px;
  font-size: clamp(0.9rem, 3.5vw, 1.1rem);
  font-weight: 800;
  letter-spacing: 0.06em;
  color: #fbbf24;
  text-align: center;
}

/* ── CONTROLS ─────────────────────────────────── */
.controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: min(90vw, 440px);
  margin-bottom: 8px;
  gap: 8px;
}
.speed-group {
  display: flex;
  align-items: center;
  gap: 6px;
}
.ctrl-label {
  font-size: .72rem;
  color: #4b5563;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.spd-btn, #restart-btn {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  color: #9ca3af;
  font-size: .75rem;
  font-weight: 600;
  padding: 5px 11px;
  border-radius: 7px;
  cursor: pointer;
  letter-spacing: .04em;
  transition: background .2s, color .2s, border-color .2s;
  font-family: inherit;
}
.spd-btn:hover, #restart-btn:hover {
  background: rgba(255,255,255,0.1);
  color: #e2e8f0;
}
.spd-btn.active {
  background: rgba(255,255,255,0.14);
  border-color: rgba(255,255,255,0.25);
  color: #f1f5f9;
}
#restart-btn, #shuffle-btn { padding: 5px 14px; }

/* ── SCOREBOARD ───────────────────────────────── */
.score {
  width: min(90vw, 440px);
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.row {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.035);
  border-radius: 10px;
  padding: 7px 11px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: border-color .35s, background .35s;
  position: relative;
  overflow: hidden;
}
.row:hover { background: rgba(255,255,255,0.06); }
.row.leading {
  background: rgba(255,255,255,0.07);
  border-color: rgba(255,255,255,0.1);
}
.row.flash-row { animation: rowFlash .35s ease; }
@keyframes rowFlash {
  0%   { background: rgba(255,255,255,0.18); }
  100% { background: rgba(255,255,255,0.035); }
}
.dot { width:11px; height:11px; border-radius:50%; flex-shrink:0; }
.bname { font-size:.82rem; font-weight:700; width:74px; color:#e2e8f0; }
.bdesc { font-size:.68rem; color:#4b5563; flex:1; transition: color .2s; }
.bar { width:80px; height:5px; background:rgba(255,255,255,0.08); border-radius:3px; overflow:hidden; flex-shrink:0; }
.bar-fill { height:100%; border-radius:3px; width:0%; transition: width .45s ease; }
.bpct { font-size:.82rem; font-weight:700; width:36px; text-align:right; color:#e2e8f0; }
.cycle-hint { font-size:.6rem; color:#374151; flex-shrink:0; }
</style>
</head>
<body>

<h1>Territory War</h1>
<p class="sub">4 algorithms fight for space</p>
<canvas id="canvas"></canvas>
<div id="msg"></div>

<div class="controls">
  <div class="speed-group">
    <span class="ctrl-label">Speed</span>
    <button class="spd-btn" data-ms="90" data-spd="3">Slow</button>
    <button class="spd-btn active" data-ms="40" data-spd="6">Normal</button>
    <button class="spd-btn" data-ms="14" data-spd="12">Fast</button>
  </div>
  <button id="restart-btn">↺ Restart</button>
  <button id="shuffle-btn">⚄ Shuffle</button>
</div>

<div class="score" id="score"></div>

<script>
// ─── GRID CONFIG ───────────────────────────────────────────────────────────
const GRID   = 71;
const CTR    = 35;
const RADIUS = 33;
const SZ     = Math.min(window.innerWidth - 28, 500);
const CELL   = SZ / GRID;

// Fixed quadrant anchors — shuffled each round so bots get different positions
const QUADRANT_STARTS = [
  [CTR - 21, CTR - 21],
  [CTR - 21, CTR + 21],
  [CTR + 21, CTR + 21],
  [CTR + 21, CTR - 21],
];

let STARTS = [...QUADRANT_STARTS];

const DIRS4 = [[-1,0],[1,0],[0,-1],[0,1]];

// ─── SPEED STATE ──────────────────────────────────────────────────────────
let tickMs       = 40;
let cellsPerTick = 6;

// ─── BOT DEFINITIONS ──────────────────────────────────────────────────────
const BOT_COLORS = [
  { color:'#F87171', light:'#fca5a5' },
  { color:'#38BDF8', light:'#7dd3fc' },
  { color:'#C084FC', light:'#d8b4fe' },
  { color:'#4ADE80', light:'#86efac' },
];

// All available strategies — assign one index per bot
const STRATEGIES = [
  { name:'Greedy',      desc:'Most open space'      },
  { name:'Aggressive',  desc:'Targets enemy borders' },
  { name:'Random',      desc:'Pure chaos'            },
  { name:'Spiral',      desc:'Clockwise sweep'       },
  { name:'Wall Hugger', desc:'Hugs the arena edge'   },
  { name:'Blob',        desc:'Compact circle'        },
  { name:'Sniper',      desc:'Aims at enemies'       },
  { name:'Coward',      desc:'Runs from enemies'     },
];

// Per-bot config that persists across rounds (user can change strategy)
const botConfigs = [0, 1, 2, 3].map((i) => ({
  id:       i + 1,
  stratIdx: i,            // default: each bot gets a unique starting strategy
  ...BOT_COLORS[i],
}));

// ─── CANVAS ───────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
canvas.width = canvas.height = SZ;
const ctx = canvas.getContext('2d');

// ─── GAME STATE ───────────────────────────────────────────────────────────
let grid, bots, totalCells, tickN, gameOver, timer;
const flash = new Map();

function K(r, c) { return r * GRID + c; }
function R(k)    { return (k / GRID) | 0; }
function C(k)    { return k % GRID; }

function inCircle(r, c) {
  return (r - CTR) ** 2 + (c - CTR) ** 2 <= RADIUS ** 2;
}

function emptyNeighbors(r, c) {
  const out = [];
  for (const [dr, dc] of DIRS4) {
    const nr = r + dr, nc = c + dc;
    if (nr >= 0 && nr < GRID && nc >= 0 && nc < GRID && grid[K(nr, nc)] === 0)
      out.push(K(nr, nc));
  }
  return out;
}

function allNeighbors(r, c) {
  const out = [];
  for (const [dr, dc] of DIRS4) {
    const nr = r + dr, nc = c + dc;
    if (nr >= 0 && nr < GRID && nc >= 0 && nc < GRID)
      out.push(K(nr, nc));
  }
  return out;
}

// ─── INIT ─────────────────────────────────────────────────────────────────
function randomizeRound() {
  // Shuffle starting quadrants so bots begin from different positions each round
  STARTS = [...QUADRANT_STARTS];
  for (let i = STARTS.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [STARTS[i], STARTS[j]] = [STARTS[j], STARTS[i]];
  }
}

function shuffleAllStrategies() {
  const indices = STRATEGIES.map((_, i) => i);
  for (let i = indices.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  botConfigs.forEach((cfg, i) => { cfg.stratIdx = indices[i]; });
}

function initGame() {
  randomizeRound();
  grid = new Int8Array(GRID * GRID).fill(-1);
  totalCells = 0;
  for (let r = 0; r < GRID; r++)
    for (let c = 0; c < GRID; c++)
      if (inCircle(r, c)) { grid[K(r, c)] = 0; totalCells++; }

  bots = botConfigs.map((cfg, i) => {
    const [sr, sc] = STARTS[i];
    const frontier = new Set();
    for (let dr = -1; dr <= 1; dr++)
      for (let dc = -1; dc <= 1; dc++) {
        const nr = sr + dr, nc = sc + dc;
        if (inCircle(nr, nc)) {
          grid[K(nr, nc)] = cfg.id;
          frontier.add(K(nr, nc));
        }
      }
    return {
      id:       cfg.id,
      color:    cfg.color,
      light:    cfg.light,
      stratIdx: cfg.stratIdx,
      frontier,
      startR:   sr,
      startC:   sc,
      angle:    Math.atan2(sr - CTR, sc - CTR),
    };
  });

  tickN    = 0;
  gameOver = false;
  flash.clear();
}

// ─── HELPERS ──────────────────────────────────────────────────────────────
function getCandidates(bot) {
  const result = new Set();
  for (const k of bot.frontier)
    for (const nk of emptyNeighbors(R(k), C(k)))
      result.add(nk);
  return [...result];
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ─── ENEMY CENTROID (shared computation per tick) ─────────────────────────
function enemyCentroid(botId) {
  let ex = 0, ey = 0, n = 0;
  for (let i = 0; i < grid.length; i++) {
    if (grid[i] > 0 && grid[i] !== botId) { ex += C(i); ey += R(i); n++; }
  }
  return n > 0 ? [ey / n, ex / n] : null;
}

// ─── STRATEGIES ───────────────────────────────────────────────────────────
const N = cellsPerTick; // alias; strategies use the live variable below

function expand_greedy(bot) {
  const c = getCandidates(bot);
  c.sort((a, b) => emptyNeighbors(R(b), C(b)).length - emptyNeighbors(R(a), C(a)).length);
  return c.slice(0, cellsPerTick);
}

function expand_aggressive(bot) {
  const c = getCandidates(bot);
  c.sort((a, b) => {
    const ea = allNeighbors(R(a), C(a)).filter(k => grid[k] > 0 && grid[k] !== bot.id).length;
    const eb = allNeighbors(R(b), C(b)).filter(k => grid[k] > 0 && grid[k] !== bot.id).length;
    return eb !== ea ? eb - ea : Math.random() - 0.5;
  });
  return c.slice(0, cellsPerTick);
}

function expand_random(bot) {
  return shuffle(getCandidates(bot)).slice(0, cellsPerTick);
}

function expand_spiral(bot) {
  const c = getCandidates(bot);
  c.sort((a, b) => {
    const aa = ((Math.atan2(R(a) - CTR, C(a) - CTR) - bot.angle + 4 * Math.PI) % (2 * Math.PI));
    const ab = ((Math.atan2(R(b) - CTR, C(b) - CTR) - bot.angle + 4 * Math.PI) % (2 * Math.PI));
    return aa - ab;
  });
  if (c.length > 0)
    bot.angle = Math.atan2(R(c[0]) - CTR, C(c[0]) - CTR) + 0.09;
  return c.slice(0, cellsPerTick);
}

function expand_wallhugger(bot) {
  const c = getCandidates(bot);
  // Prefer cells farthest from center (closest to arena edge)
  c.sort((a, b) => {
    const da = (R(a) - CTR) ** 2 + (C(a) - CTR) ** 2;
    const db = (R(b) - CTR) ** 2 + (C(b) - CTR) ** 2;
    return db - da;
  });
  return c.slice(0, cellsPerTick);
}

function expand_blob(bot) {
  const c = getCandidates(bot);
  // Prefer cells closest to own start — makes a compact circular blob
  c.sort((a, b) => {
    const da = (R(a) - bot.startR) ** 2 + (C(a) - bot.startC) ** 2;
    const db = (R(b) - bot.startR) ** 2 + (C(b) - bot.startC) ** 2;
    return da - db;
  });
  return c.slice(0, cellsPerTick);
}

function expand_sniper(bot) {
  const c = getCandidates(bot);
  const ec = enemyCentroid(bot.id);
  if (!ec) return shuffle(c).slice(0, cellsPerTick);
  const [ey, ex] = ec;
  c.sort((a, b) => {
    const da = (R(a) - ey) ** 2 + (C(a) - ex) ** 2;
    const db = (R(b) - ey) ** 2 + (C(b) - ex) ** 2;
    return da - db; // closer to enemy cluster first
  });
  return c.slice(0, cellsPerTick);
}

function expand_coward(bot) {
  const c = getCandidates(bot);
  const ec = enemyCentroid(bot.id);
  if (!ec) return shuffle(c).slice(0, cellsPerTick);
  const [ey, ex] = ec;
  c.sort((a, b) => {
    const da = (R(a) - ey) ** 2 + (C(a) - ex) ** 2;
    const db = (R(b) - ey) ** 2 + (C(b) - ex) ** 2;
    return db - da; // farther from enemy cluster first
  });
  return c.slice(0, cellsPerTick);
}

const STRATEGY_FNS = [
  expand_greedy,
  expand_aggressive,
  expand_random,
  expand_spiral,
  expand_wallhugger,
  expand_blob,
  expand_sniper,
  expand_coward,
];

// ─── TICK ─────────────────────────────────────────────────────────────────
function claim(bot, k) {
  if (grid[k] !== 0) return;
  grid[k] = bot.id;
  bot.frontier.add(k);
  flash.set(k, bot.light);
}

function pruneFrontier(bot) {
  for (const k of [...bot.frontier])
    if (emptyNeighbors(R(k), C(k)).length === 0) bot.frontier.delete(k);
}

function tick() {
  if (gameOver) return;
  tickN++;
  flash.clear();

  for (let i = 0; i < bots.length; i++) {
    const bot = bots[i];
    bot.stratIdx = botConfigs[i].stratIdx; // pick up live changes
    for (const k of STRATEGY_FNS[bot.stratIdx](bot)) claim(bot, k);
    if (tickN % 12 === i) pruneFrontier(bot);
  }

  let empty = 0;
  for (let i = 0; i < grid.length; i++) if (grid[i] === 0) empty++;
  const stuck = empty > 0 && bots.every(b => getCandidates(b).length === 0);

  if (empty === 0 || tickN > 700 || stuck) { endGame(); return; }

  render();
  updateUI();
}

// ─── RENDER ───────────────────────────────────────────────────────────────
const COLOR_MAP = ['', ...BOT_COLORS.map(b => b.color)];
const EMPTY_COLOR = 'rgba(255,255,255,0.07)';
const PAD  = 0.7;
const FSIZ = CELL - PAD * 2;

function render() {
  ctx.clearRect(0, 0, SZ, SZ);
  ctx.save();
  ctx.beginPath();
  ctx.arc(SZ / 2, SZ / 2, SZ / 2, 0, Math.PI * 2);
  ctx.clip();

  for (let r = 0; r < GRID; r++) {
    for (let c = 0; c < GRID; c++) {
      const v = grid[K(r, c)];
      if (v === -1) continue;
      ctx.fillStyle = v === 0 ? EMPTY_COLOR : (flash.get(K(r, c)) || COLOR_MAP[v]);
      ctx.fillRect(c * CELL + PAD, r * CELL + PAD, FSIZ, FSIZ);
    }
  }
  ctx.restore();
}

// ─── SCOREBOARD ───────────────────────────────────────────────────────────
function buildUI() {
  document.getElementById('score').innerHTML = botConfigs.map(cfg => {
    const s = STRATEGIES[cfg.stratIdx];
    return `
    <div class="row" id="row${cfg.id}" data-bot="${cfg.id}">
      <div class="dot" style="background:${cfg.color}"></div>
      <span class="bname" id="bname${cfg.id}">${s.name}</span>
      <span class="bdesc" id="bdesc${cfg.id}">${s.desc}</span>
      <div class="bar"><div class="bar-fill" id="bar${cfg.id}" style="background:${cfg.color}"></div></div>
      <span class="bpct" id="pct${cfg.id}">0%</span>
      <span class="cycle-hint">⟳</span>
    </div>`;
  }).join('');

  // Bot row click → cycle strategy
  document.getElementById('score').addEventListener('click', e => {
    const row = e.target.closest('.row[data-bot]');
    if (!row) return;
    const botId  = +row.dataset.bot;
    const cfg    = botConfigs[botId - 1];
    cfg.stratIdx = (cfg.stratIdx + 1) % STRATEGIES.length;
    // Also update live bot if game is running
    if (bots && !gameOver) bots[botId - 1].stratIdx = cfg.stratIdx;
    const s = STRATEGIES[cfg.stratIdx];
    document.getElementById(`bname${botId}`).textContent = s.name;
    document.getElementById(`bdesc${botId}`).textContent = s.desc;
    row.classList.remove('flash-row');
    void row.offsetWidth; // reflow to re-trigger animation
    row.classList.add('flash-row');
  });
}

function updateUI() {
  const counts = [0, 0, 0, 0, 0];
  for (let i = 0; i < grid.length; i++) { const v = grid[i]; if (v > 0) counts[v]++; }
  let leadId = 1;
  for (let i = 2; i <= 4; i++) if (counts[i] > counts[leadId]) leadId = i;

  for (const cfg of botConfigs) {
    const pct = totalCells > 0 ? Math.round(counts[cfg.id] / totalCells * 100) : 0;
    document.getElementById(`pct${cfg.id}`).textContent = pct + '%';
    document.getElementById(`bar${cfg.id}`).style.width  = pct + '%';
    document.getElementById(`row${cfg.id}`).classList.toggle('leading', cfg.id === leadId);
  }
}

// ─── SPEED CONTROL ────────────────────────────────────────────────────────
document.querySelectorAll('.spd-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.spd-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    tickMs       = +btn.dataset.ms;
    cellsPerTick = +btn.dataset.spd;
    if (!gameOver) {
      clearInterval(timer);
      timer = setInterval(tick, tickMs);
    }
  });
});

document.getElementById('restart-btn').addEventListener('click', () => {
  clearTimeout(restartTimeout);
  startGame();
});

document.getElementById('shuffle-btn').addEventListener('click', () => {
  shuffleAllStrategies();
  clearTimeout(restartTimeout);
  startGame();
});

// ─── GAME END ─────────────────────────────────────────────────────────────
let restartTimeout;

function endGame() {
  gameOver = true;
  clearInterval(timer);
  render();
  updateUI();

  const counts = [0, 0, 0, 0, 0];
  for (let i = 0; i < grid.length; i++) { const v = grid[i]; if (v > 0) counts[v]++; }
  let winId = 1;
  for (let i = 2; i <= 4; i++) if (counts[i] > counts[winId]) winId = i;

  const wCfg = botConfigs[winId - 1];
  const pct  = Math.round(counts[winId] / totalCells * 100);
  const wStrat = STRATEGIES[wCfg.stratIdx];
  document.getElementById('msg').textContent = `${wStrat.name} wins — ${pct}% claimed!`;

  restartTimeout = setTimeout(startGame, 4200);
}

// ─── START ────────────────────────────────────────────────────────────────
function startGame() {
  clearInterval(timer);
  clearTimeout(restartTimeout);
  initGame();
  buildUI();
  render();
  updateUI();

  const msgEl = document.getElementById('msg');
  let count = 3;
  msgEl.textContent = count;

  const cd = setInterval(() => {
    count--;
    if (count > 0) {
      msgEl.textContent = count;
    } else {
      msgEl.textContent = 'GO!';
      clearInterval(cd);
      setTimeout(() => {
        msgEl.textContent = '';
        timer = setInterval(tick, tickMs);
      }, 500);
    }
  }, 700);
}

startGame();
</script>
</body>
</html>

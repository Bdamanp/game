<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Territory War</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #0d1117;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: #fff;
  padding: 16px;
  user-select: none;
  -webkit-user-select: none;
}
h1 {
  font-size: clamp(1.3rem, 6vw, 2rem);
  font-weight: 900;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  background: linear-gradient(135deg, #f1f5f9, #94a3b8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 2px;
}
.sub {
  font-size: clamp(0.62rem, 2.2vw, 0.78rem);
  color: #374151;
  letter-spacing: 0.12em;

  margin-bottom: 14px;
}
#canvas {
  display: block;
  border-radius: 50%;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 0 80px rgba(0,0,0,0.6);
}
#msg {
  height: 28px;
  margin: 10px 0 6px;
  font-size: clamp(0.9rem, 3.5vw, 1.1rem);
  font-weight: 800;
  letter-spacing: 0.06em;
  color: #fbbf24;

}

/* ── CONTROLS ─────────────────────────────────── */
.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  width: min(94vw, 480px);
  margin-bottom: 8px;
  gap: 6px;
  flex-wrap: wrap;
}
.speed-group {
  display: flex;
  align-items: center;
  gap: 5px;
}
.ctrl-label {
  font-size: .72rem;
  color: #4b5563;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.btn {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  color: #9ca3af;
  font-size: .75rem;
  font-weight: 600;
  padding: 5px 11px;
  border-radius: 7px;
  cursor: pointer;
  letter-spacing: .04em;
  transition: background .2s, color .2s, border-color .2s;

}
.btn:hover {
  background: rgba(255,255,255,0.1);
  color: #e2e8f0;
}
.btn.active {
  background: rgba(255,255,255,0.14);
  border-color: rgba(255,255,255,0.25);

}
.btn:disabled {
  opacity: 0.35;
  cursor: default;
}

/* Start button — green accent */
#start-btn {
  background: rgba(74,222,128,0.15);
  border-color: rgba(74,222,128,0.35);
  color: #4ade80;
  padding: 5px 16px;
}
#start-btn:hover:not(:disabled) {
  background: rgba(74,222,128,0.25);
  color: #86efac;
}

/* Record button */
#rec-btn.recording {
  background: rgba(239,68,68,0.18);
  border-color: rgba(239,68,68,0.45);
  color: #f87171;
  animation: recPulse 1s infinite;
}
@keyframes recPulse {
  0%,100% { opacity:1; }

}

/* Sound muted */
#sound-btn.muted {
  color: #ef4444;
  border-color: rgba(239,68,68,0.3);
}

/* ── SCOREBOARD ───────────────────────────────── */
.score {
  width: min(90vw, 440px);
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.row {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.035);
  border-radius: 10px;
  padding: 7px 11px;
  border: 1px solid transparent;
  transition: border-color .35s, background .35s;
  overflow: hidden;
}
.row:hover { background: rgba(255,255,255,0.06); }
.row.leading {
  background: rgba(255,255,255,0.07);
  border-color: rgba(255,255,255,0.1);
}
.row.flash-row { animation: rowFlash .35s ease; }
@keyframes rowFlash {
  0%   { background: rgba(255,255,255,0.18); }
  100% { background: rgba(255,255,255,0.035); }
}
.dot { width:11px; height:11px; border-radius:50%; flex-shrink:0; }
.bot-name { font-size:.82rem; font-weight:800; width:42px; flex-shrink:0; }
.bdesc { font-size:.68rem; color:#4b5563; flex:1; transition: color .2s; }
.bar { width:80px; height:5px; background:rgba(255,255,255,0.08); border-radius:3px; overflow:hidden; flex-shrink:0; }
.bar-fill { height:100%; border-radius:3px; width:0%; transition: width .45s ease; }
.bpct { font-size:.82rem; font-weight:700; width:36px; text-align:right; color:#e2e8f0; }
.row.trapped { opacity: 0.45; }
.row.trapped .bpct { color: #ef4444 !important; }
.strat-select {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.12);
  color: #e2e8f0;
  border-radius: 7px;
  padding: 3px 6px;
  font-size: .75rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  outline: none;
  width: 108px;
  flex-shrink: 0;
  transition: border-color .2s;
}
.strat-select:focus { border-color: rgba(255,255,255,0.3); }
.strat-select option { background: #1f2937; color: #e2e8f0; }
</style>

<body>

<h1>Territory War</h1>
<p class="sub">4 algorithms fight for space</p>
<canvas id="canvas"></canvas>
<div id="msg">Pick strategies & press Start</div>

<div class="controls">
  <div class="speed-group">
    <span class="ctrl-label">Speed</span>
    <button class="btn" data-ms="90" data-spd="3">Slow</button>
    <button class="btn active" data-ms="40" data-spd="6">Normal</button>
    <button class="btn" data-ms="14" data-spd="12">Fast</button>
  </div>
  <button class="btn" id="start-btn">▶ Start</button>
  <button class="btn" id="shuffle-btn">⚄ Shuffle</button>
  <button class="btn" id="sound-btn">🔊</button>
  <button class="btn" id="rec-btn">⏺ Rec</button>
</div>

<div class="score" id="score"></div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// SOUND SYSTEM  — Web Audio API, no external files
// ═══════════════════════════════════════════════════════════════════════════
let audioCtx  = null;
let audioDest  = null;   // MediaStreamDestination for recording audio
let soundOn   = true;

function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

// Route a GainNode to speakers + the recording stream (if active)
function routeGain(gain) {
  gain.connect(audioCtx.destination);
  if (audioDest) gain.connect(audioDest);
}

function tone(freq, dur, vol = 0.25, type = 'sine', delay = 0) {
  if (!soundOn || !audioCtx) return;
  const osc  = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  routeGain(gain);
  osc.type = type;
  osc.frequency.value = freq;
  const t = audioCtx.currentTime + delay;
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.start(t);
  osc.stop(t + dur + 0.01);
}

function playCountdown(n) {
  ensureAudio();
  const freqs = { 3: 330, 2: 392, 1: 523 };
  tone(freqs[n] || 660, 0.12, 0.2, 'sine');
}

function playGo() {
  ensureAudio();
  [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, 0.25, 'square', i * 0.07));
}

function playTickSound() {
  if (!soundOn || !audioCtx) return;
  const buf  = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.025, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
  const src  = audioCtx.createBufferSource();
  const gain = audioCtx.createGain();
  const filt = audioCtx.createBiquadFilter();
  src.buffer = buf;
  filt.type  = 'lowpass';
  filt.frequency.value = 600;
  src.connect(filt);
  filt.connect(gain);
  routeGain(gain);
  gain.gain.value = 0.06;
  src.start();
}

function playWinner() {
  ensureAudio();
  const melody = [392, 523, 659, 784, 1047];
  melody.forEach((f, i) => tone(f, i < 4 ? 0.1 : 0.4, 0.3, 'square', i * 0.09));
}

// ═══════════════════════════════════════════════════════════════════════════
// RECORDING  — full UI composited onto 1080×1080 offscreen canvas → .webm
// ═══════════════════════════════════════════════════════════════════════════
const REC_SZ  = 1080;
const recCanvas = document.createElement('canvas');
recCanvas.width = recCanvas.height = REC_SZ;
const rctx = recCanvas.getContext('2d');

// Layout for the recording frame
const RL = {
  bg:      '#0d1117',
  titleY:  58,
  subY:    90,
  arenaCX: 540,
  arenaCY: 435,
  arenaR:  296,
  msgY:    775,
  scoreX:  165,
  scoreW:  750,
  scoreY:  810,
  rowH:    48,
  font:    '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
};

function rrect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function renderRecFrame() {
  const r = rctx;

  // ── Background ──
  r.fillStyle = RL.bg;
  r.fillRect(0, 0, REC_SZ, REC_SZ);

  // ── Title ──
  r.textAlign = 'center';
  r.textBaseline = 'middle';
  r.fillStyle = '#e2e8f0';
  r.font = `900 40px ${RL.font}`;
  r.fillText('TERRITORY WAR', REC_SZ / 2, RL.titleY);

  // ── Subtitle ──
  r.fillStyle = '#4b5563';
  r.font = `400 15px ${RL.font}`;
  r.fillText('4 algorithms fight for space', REC_SZ / 2, RL.subY);

  // ── Arena — re-render at recording resolution for crisp pixels ──
  const aLeft = RL.arenaCX - RL.arenaR;
  const aTop  = RL.arenaCY - RL.arenaR;
  const aDiam = RL.arenaR * 2;
  const cSz   = aDiam / GRID;
  const cPad  = cSz * 0.1;

  r.save();
  r.beginPath();
  r.arc(RL.arenaCX, RL.arenaCY, RL.arenaR, 0, Math.PI * 2);
  r.clip();

  for (let row = 0; row < GRID; row++) {
    for (let col = 0; col < GRID; col++) {
      const v = grid[K(row, col)];
      if (v === -1) continue;
      const isTrappedCell = v > 0 && bots && bots[v - 1] && bots[v - 1].trapped;
      r.fillStyle = v === 0 ? 'rgba(255,255,255,0.07)'
        : (flash.get(K(row, col)) || (isTrappedCell ? DARK_MAP[v] : COLOR_MAP[v]));
      r.fillRect(aLeft + col * cSz + cPad, aTop + row * cSz + cPad, cSz - cPad * 2, cSz - cPad * 2);
    }
  }
  // ── Head markers on recording canvas ──
  if (bots) {
    const pulse = 0.88 + 0.12 * Math.sin(tickN * 0.35);
    for (const bot of bots) {
      if (!bot.head || bot.trapped) continue;
      const hr  = R(bot.head), hc = C(bot.head);
      const cx  = aLeft + (hc + 0.5) * cSz;
      const cy  = aTop  + (hr + 0.5) * cSz;
      const rad = cSz * 0.52 * pulse;

      // Clamp to circle
      const dx = cx - RL.arenaCX, dy = cy - RL.arenaCY;
      if (dx * dx + dy * dy > RL.arenaR * RL.arenaR) continue;

      // Glow ring
      r.beginPath();
      r.arc(cx, cy, rad * 1.55, 0, Math.PI * 2);
      r.fillStyle = bot.color + '55';
      r.fill();

      // Main circle
      r.beginPath();
      r.arc(cx, cy, rad, 0, Math.PI * 2);
      r.fillStyle = bot.light;
      r.fill();

      // White pupil
      r.beginPath();
      r.arc(cx, cy, rad * 0.32, 0, Math.PI * 2);
      r.fillStyle = '#ffffff';
      r.fill();
    }
  }

  r.restore();

  // Arena ring shadow
  r.beginPath();
  r.arc(RL.arenaCX, RL.arenaCY, RL.arenaR + 1, 0, Math.PI * 2);
  r.strokeStyle = 'rgba(255,255,255,0.06)';
  r.lineWidth = 1;
  r.stroke();

  // ── Message (countdown / winner) ──
  const msgText = document.getElementById('msg').textContent;
  if (msgText) {
    r.textAlign = 'center';
    r.fillStyle = '#fbbf24';
    r.font = `800 28px ${RL.font}`;
    r.fillText(msgText, REC_SZ / 2, RL.msgY);
  }

  // ── Scoreboard ──
  const counts = [0, 0, 0, 0, 0];
  for (let i = 0; i < grid.length; i++) { const v = grid[i]; if (v > 0) counts[v]++; }

  // Compute leader
  let recLeadId = 1;
  for (let i = 2; i <= 4; i++) if (counts[i] > counts[recLeadId]) recLeadId = i;
  const recLeadBot = bots && bots[recLeadId - 1];
  if (recLeadBot && recLeadBot.trapped) recLeadId = -1;

  botConfigs.forEach((cfg, idx) => {
    const y      = RL.scoreY + idx * RL.rowH;
    const h      = RL.rowH - 8;
    const mid    = y + h / 2;
    const strat  = STRATEGIES[cfg.stratIdx];
    const pct    = totalCells > 0 ? Math.round(counts[cfg.id] / totalCells * 100) : 0;
    const bot    = bots && bots[cfg.id - 1];
    const trapped = bot && bot.trapped;
    const isLead = cfg.id === recLeadId;

    // Row bg — glow for leader
    if (isLead) {
      r.shadowColor = cfg.color;
      r.shadowBlur  = 18;
    }
    r.fillStyle = isLead ? `${cfg.color}22` : 'rgba(255,255,255,0.04)';
    rrect(r, RL.scoreX, y, RL.scoreW, h, 10);
    r.fill();
    if (isLead) {
      r.strokeStyle = `${cfg.color}88`;
      r.lineWidth   = 1.5;
      r.stroke();
      r.shadowBlur = 0;
    }
    r.shadowBlur = 0;

    // Color dot
    r.beginPath();
    r.arc(RL.scoreX + 20, mid, 7, 0, Math.PI * 2);
    r.fillStyle = trapped ? '#374151' : cfg.color;
    r.fill();

    // Bot name (prominent, colored)
    r.textAlign    = 'left';
    r.textBaseline = 'middle';
    r.fillStyle    = trapped ? '#374151' : cfg.color;
    r.font         = `800 16px ${RL.font}`;
    r.fillText(cfg.name, RL.scoreX + 36, mid);

    // Strategy name (gray)
    r.fillStyle = trapped ? '#374151' : '#6b7280';
    r.font      = `400 13px ${RL.font}`;
    r.fillText(strat.name, RL.scoreX + 105, mid);

    // Bar bg
    const barX = RL.scoreX + 430;
    const barW = 200;
    const barH = 7;
    const barY = mid - barH / 2;
    r.fillStyle = 'rgba(255,255,255,0.08)';
    rrect(r, barX, barY, barW, barH, 3);
    r.fill();

    if (!trapped && pct > 0) {
      r.fillStyle = cfg.color;
      rrect(r, barX, barY, Math.max(barW * pct / 100, 4), barH, 3);
      r.fill();
    }

    // Right-side label
    r.textAlign = 'right';
    if (trapped) {
      r.fillStyle = '#ef4444';
      r.font      = `700 14px ${RL.font}`;
      r.fillText('TRAPPED', RL.scoreX + RL.scoreW - 14, mid);
    } else {
      r.fillStyle = isLead ? cfg.color : '#e2e8f0';
      r.font      = `${isLead ? '800' : '700'} ${isLead ? 18 : 16}px ${RL.font}`;
      r.fillText((isLead ? '▲ ' : '') + pct + '%', RL.scoreX + RL.scoreW - 14, mid);
    }
  });
}

// ── MediaRecorder plumbing ──
let mediaRecorder  = null;
let recordedChunks = [];
let isRecording    = false;
let recRAF         = null;

function recLoop() {
  if (!isRecording) return;
  renderRecFrame();
  recRAF = requestAnimationFrame(recLoop);
}

function startRecording() {
  ensureAudio();
  audioDest = audioCtx.createMediaStreamDestination();

  // First render so the stream has an initial frame
  renderRecFrame();

  const vidStream = recCanvas.captureStream(30);
  const combined  = new MediaStream([
    ...vidStream.getVideoTracks(),
    ...audioDest.stream.getAudioTracks(),
  ]);

  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
    ? 'video/webm;codecs=vp9' : 'video/webm';
  mediaRecorder = new MediaRecorder(combined, { mimeType: mime });
  recordedChunks = [];

  mediaRecorder.ondataavailable = e => {
    if (e.data.size > 0) recordedChunks.push(e.data);
  };

  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: 'video/webm' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `territory-war-${Date.now()}.webm`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    audioDest = null;
  };

  mediaRecorder.start(200);
  isRecording = true;
  recRAF = requestAnimationFrame(recLoop);
  updateRecBtn();
}

function stopRecording() {
  isRecording = false;
  cancelAnimationFrame(recRAF);
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  updateRecBtn();
}

function updateRecBtn() {
  const btn = document.getElementById('rec-btn');
  btn.textContent  = isRecording ? '⏹ Stop' : '⏺ Rec';
  btn.classList.toggle('recording', isRecording);
}

// ═══════════════════════════════════════════════════════════════════════════
// GRID CONFIG
// ═══════════════════════════════════════════════════════════════════════════
const GRID   = 71;
const CTR    = 35;
const RADIUS = 33;
const SZ     = Math.min(window.innerWidth - 28, 500);
const CELL   = SZ / GRID;

const QUADRANT_STARTS = [
  [CTR - 21, CTR - 21],
  [CTR - 21, CTR + 21],
  [CTR + 21, CTR + 21],
  [CTR + 21, CTR - 21],
];
let STARTS = [...QUADRANT_STARTS];

const DIRS4 = [[-1,0],[1,0],[0,-1],[0,1]];

// ── SPEED STATE ──
let tickMs       = 40;
let cellsPerTick = 6;

// ── BOT DEFINITIONS ──
const BOT_COLORS = [
  { color:'#F87171', light:'#fca5a5' },
  { color:'#38BDF8', light:'#7dd3fc' },
  { color:'#C084FC', light:'#d8b4fe' },
  { color:'#4ADE80', light:'#86efac' },
];

const STRATEGIES = [
  { name:'Greedy',      desc:'Rushes the center'       },
  { name:'Aggressive',  desc:'Targets enemy borders'  },
  { name:'Random',      desc:'Pure chaos'             },
  { name:'Spiral',      desc:'Clockwise sweep'        },
  { name:'Wall Hugger', desc:'Hugs the arena edge'    },
  { name:'Blob',        desc:'Compact circle'         },
  { name:'Sniper',      desc:'Aims at enemies'        },
  { name:'Coward',      desc:'Runs from enemies'      },
];

const BOT_NAMES = ['Blaze', 'Frost', 'Storm', 'Venom'];

const botConfigs = [0,1,2,3].map(i => ({
  id: i + 1, name: BOT_NAMES[i], stratIdx: i, ...BOT_COLORS[i],
}));

// ═══════════════════════════════════════════════════════════════════════════
// CANVAS
// ═══════════════════════════════════════════════════════════════════════════
const canvas = document.getElementById('canvas');
canvas.width = canvas.height = SZ;
const ctx = canvas.getContext('2d');

// ═══════════════════════════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════════════════════════
let grid, bots, totalCells, tickN, gameOver, timer, countdownTimer;
let running = false;  // true while countdown or game loop is active
const flash = new Map();

function K(r, c) { return r * GRID + c; }
function R(k)    { return (k / GRID) | 0; }
function C(k)    { return k % GRID; }

function inCircle(r, c) {
  return (r - CTR) ** 2 + (c - CTR) ** 2 <= RADIUS ** 2;
}

function emptyNeighbors(r, c) {
  const out = [];
  for (const [dr, dc] of DIRS4) {
    const nr = r + dr, nc = c + dc;
    if (nr >= 0 && nr < GRID && nc >= 0 && nc < GRID && grid[K(nr, nc)] === 0)
      out.push(K(nr, nc));
  }
  return out;
}

function allNeighbors(r, c) {
  const out = [];
  for (const [dr, dc] of DIRS4) {
    const nr = r + dr, nc = c + dc;
    if (nr >= 0 && nr < GRID && nc >= 0 && nc < GRID)
      out.push(K(nr, nc));
  }
  return out;
}

// ═══════════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════════
function randomizeRound() {
  STARTS = [...QUADRANT_STARTS];
  for (let i = STARTS.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [STARTS[i], STARTS[j]] = [STARTS[j], STARTS[i]];
  }
}

function shuffleAllStrategies() {
  const idx = STRATEGIES.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  botConfigs.forEach((cfg, i) => { cfg.stratIdx = idx[i]; });
}

function initGame() {
  randomizeRound();
  grid = new Int8Array(GRID * GRID).fill(-1);
  totalCells = 0;
  for (let r = 0; r < GRID; r++)
    for (let c = 0; c < GRID; c++)
      if (inCircle(r, c)) { grid[K(r, c)] = 0; totalCells++; }

  bots = botConfigs.map((cfg, i) => {
    const [sr, sc] = STARTS[i];
    const frontier = new Set();
    for (let dr = -1; dr <= 1; dr++)
      for (let dc = -1; dc <= 1; dc++) {
        const nr = sr + dr, nc = sc + dc;
        if (inCircle(nr, nc)) {
          grid[K(nr, nc)] = cfg.id;
          frontier.add(K(nr, nc));
        }
      }
    return {
      id: cfg.id, color: cfg.color, light: cfg.light,
      stratIdx: cfg.stratIdx, frontier,
      startR: sr, startC: sc,
      angle: Math.atan2(sr - CTR, sc - CTR),
      trapped: false, trapCount: 0, head: null,
    };
  });

  tickN = 0;
  gameOver = false;
  flash.clear();
}

// ═══════════════════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════════════════
function getCandidates(bot) {
  const result = new Set();
  for (const k of bot.frontier)
    for (const nk of emptyNeighbors(R(k), C(k)))
      result.add(nk);
  return [...result];
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function enemyCentroid(botId) {
  let ex = 0, ey = 0, n = 0;
  for (let i = 0; i < grid.length; i++) {
    if (grid[i] > 0 && grid[i] !== botId) { ex += C(i); ey += R(i); n++; }
  }
  return n > 0 ? [ey / n, ex / n] : null;
}

// ═══════════════════════════════════════════════════════════════════════════
// STRATEGIES
// ═══════════════════════════════════════════════════════════════════════════
function expand_greedy(bot) {
  const c = getCandidates(bot);
  // Rush toward center of arena (strategic position, but not a snowball)
  c.sort((a, b) => {
    const da = (R(a) - CTR) ** 2 + (C(a) - CTR) ** 2;
    const db = (R(b) - CTR) ** 2 + (C(b) - CTR) ** 2;
    return da - db + (Math.random() - 0.5) * 8; // add noise for variety
  });
  return c.slice(0, cellsPerTick);
}

function expand_aggressive(bot) {
  const c = getCandidates(bot);
  c.sort((a, b) => {
    const ea = allNeighbors(R(a), C(a)).filter(k => grid[k] > 0 && grid[k] !== bot.id).length;
    const eb = allNeighbors(R(b), C(b)).filter(k => grid[k] > 0 && grid[k] !== bot.id).length;
    return eb !== ea ? eb - ea : Math.random() - 0.5;
  });
  return c.slice(0, cellsPerTick);
}

function expand_random(bot) {
  return shuffle(getCandidates(bot)).slice(0, cellsPerTick);
}

function expand_spiral(bot) {
  const c = getCandidates(bot);
  c.sort((a, b) => {
    const aa = ((Math.atan2(R(a) - CTR, C(a) - CTR) - bot.angle + 4 * Math.PI) % (2 * Math.PI));
    const ab = ((Math.atan2(R(b) - CTR, C(b) - CTR) - bot.angle + 4 * Math.PI) % (2 * Math.PI));
    return aa - ab;
  });
  if (c.length > 0) bot.angle = Math.atan2(R(c[0]) - CTR, C(c[0]) - CTR) + 0.09;
  return c.slice(0, cellsPerTick);
}

function expand_wallhugger(bot) {
  const c = getCandidates(bot);
  c.sort((a, b) => {
    return ((R(b)-CTR)**2+(C(b)-CTR)**2) - ((R(a)-CTR)**2+(C(a)-CTR)**2);
  });
  return c.slice(0, cellsPerTick);
}

function expand_blob(bot) {
  const c = getCandidates(bot);
  c.sort((a, b) => {
    return ((R(a)-bot.startR)**2+(C(a)-bot.startC)**2) - ((R(b)-bot.startR)**2+(C(b)-bot.startC)**2);
  });
  return c.slice(0, cellsPerTick);
}

function expand_sniper(bot) {
  const c = getCandidates(bot);
  const ec = enemyCentroid(bot.id);
  if (!ec) return shuffle(c).slice(0, cellsPerTick);
  const [ey, ex] = ec;
  c.sort((a, b) => ((R(a)-ey)**2+(C(a)-ex)**2) - ((R(b)-ey)**2+(C(b)-ex)**2));
  return c.slice(0, cellsPerTick);
}

function expand_coward(bot) {
  const c = getCandidates(bot);
  const ec = enemyCentroid(bot.id);
  if (!ec) return shuffle(c).slice(0, cellsPerTick);
  const [ey, ex] = ec;
  c.sort((a, b) => ((R(b)-ey)**2+(C(b)-ex)**2) - ((R(a)-ey)**2+(C(a)-ex)**2));
  return c.slice(0, cellsPerTick);
}

const STRATEGY_FNS = [
  expand_greedy, expand_aggressive, expand_random, expand_spiral,
  expand_wallhugger, expand_blob, expand_sniper, expand_coward,
];

// ═══════════════════════════════════════════════════════════════════════════
// TICK
// ═══════════════════════════════════════════════════════════════════════════
function pruneFrontier(bot) {
  for (const k of [...bot.frontier])
    if (emptyNeighbors(R(k), C(k)).length === 0) bot.frontier.delete(k);
}

// Territory stealing: weakly-held border cells get captured by surrounding enemies
function resolveConflicts() {
  const steals = [];

  for (let r = 0; r < GRID; r++) {
    for (let c = 0; c < GRID; c++) {
      const v = grid[K(r, c)];
      if (v <= 0) continue;

      const nbrs = allNeighbors(r, c);
      let friendly = 0;
      const enemyCounts = {};

      for (const nk of nbrs) {
        const nv = grid[nk];
        if (nv === v) friendly++;
        else if (nv > 0) enemyCounts[nv] = (enemyCounts[nv] || 0) + 1;
      }

      // Trapped bots are easier to eat (threshold drops to 2)
      const ownerTrapped = bots && bots[v - 1] && bots[v - 1].trapped;
      const threshold = ownerTrapped ? 2 : 3;

      if (friendly <= 1) {
        for (const eid in enemyCounts) {
          if (enemyCounts[eid] >= threshold) {
            steals.push([K(r, c), +eid]);
            break;
          }
        }
      }
    }
  }

  for (const [k, newOwner] of steals) {
    const oldId = grid[k];
    grid[k] = newOwner;
    // Move from old frontier to new
    if (bots[oldId - 1]) bots[oldId - 1].frontier.delete(k);
    if (bots[newOwner - 1]) {
      bots[newOwner - 1].frontier.add(k);
      flash.set(k, bots[newOwner - 1].light);
    }
  }
}

function tick() {
  if (gameOver) return;
  tickN++;
  flash.clear();

  // Shuffle turn order each tick — no first-mover advantage
  const order = [0, 1, 2, 3];
  shuffle(order);

  for (const i of order) {
    const bot = bots[i];
    bot.stratIdx = botConfigs[i].stratIdx;

    if (!bot.trapped) {
      const cands = getCandidates(bot);
      if (cands.length === 0) {
        bot.trapCount++;
        if (bot.trapCount >= 4) {
          bot.trapped = true;
          tone(220, 0.35, 0.2, 'sawtooth'); // trapped thud
        }
      } else {
        bot.trapCount = 0;
        const toPlace = STRATEGY_FNS[bot.stratIdx](bot);
        let headSet = false;
        for (const k of toPlace) {
          if (grid[k] !== 0) continue;
          grid[k] = bot.id;
          bot.frontier.add(k);
          flash.set(k, bot.light);
          if (!headSet) { bot.head = k; headSet = true; }
        }
      }
    } else {
      bot.head = null;
    }
    if (tickN % 12 === i) pruneFrontier(bot);
  }

  // Border conflict: steal weakly-held cells every 3 ticks
  if (tickN % 3 === 0) resolveConflicts();

  let empty = 0;
  for (let i = 0; i < grid.length; i++) if (grid[i] === 0) empty++;

  const activeBots = bots.filter(b => !b.trapped);
  const stuck = empty > 0 && activeBots.length > 0 && activeBots.every(b => getCandidates(b).length === 0);
  const allDone = empty === 0 || activeBots.length === 0;

  if (allDone || tickN > 700 || stuck) { endGame(); return; }

  playTickSound();
  render();
  updateUI();
}

// ═══════════════════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════════════════
const COLOR_MAP   = ['', ...BOT_COLORS.map(b => b.color)];
const DARK_MAP    = ['', ...BOT_COLORS.map(b => {
  const n = parseInt(b.color.slice(1), 16);
  const r = ((n >> 16) & 255) * 0.28 | 0;
  const g = ((n >> 8)  & 255) * 0.28 | 0;
  const bl = (n & 255)        * 0.28 | 0;
  return `rgb(${r},${g},${bl})`;
})];
const EMPTY_COLOR = 'rgba(255,255,255,0.07)';
const PAD  = 0.7;
const FSIZ = CELL - PAD * 2;

function render() {
  ctx.clearRect(0, 0, SZ, SZ);
  ctx.save();
  ctx.beginPath();
  ctx.arc(SZ / 2, SZ / 2, SZ / 2, 0, Math.PI * 2);
  ctx.clip();

  for (let r = 0; r < GRID; r++) {
    for (let c = 0; c < GRID; c++) {
      const v = grid[K(r, c)];
      if (v === -1) continue;
      const isTrapped = v > 0 && bots && bots[v - 1] && bots[v - 1].trapped;
      ctx.fillStyle = v === 0 ? EMPTY_COLOR
        : (flash.get(K(r, c)) || (isTrapped ? DARK_MAP[v] : COLOR_MAP[v]));
      ctx.fillRect(c * CELL + PAD, r * CELL + PAD, FSIZ, FSIZ);
    }
  }

  // ── Head markers ── draw on top of territory
  if (bots) {
    const pulse = 0.88 + 0.12 * Math.sin(tickN * 0.35);
    for (const bot of bots) {
      if (!bot.head || bot.trapped) continue;
      const hr = R(bot.head), hc = C(bot.head);
      const cx = (hc + 0.5) * CELL;
      const cy = (hr + 0.5) * CELL;
      const rad = CELL * 0.52 * pulse;

      // Outer glow ring
      ctx.beginPath();
      ctx.arc(cx, cy, rad * 1.55, 0, Math.PI * 2);
      ctx.fillStyle = bot.color + '55';
      ctx.fill();

      // Main circle
      ctx.beginPath();
      ctx.arc(cx, cy, rad, 0, Math.PI * 2);
      ctx.fillStyle = bot.light;
      ctx.fill();

      // White pupil
      ctx.beginPath();
      ctx.arc(cx, cy, rad * 0.32, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
    }
  }

  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════════════
// SCOREBOARD
// ═══════════════════════════════════════════════════════════════════════════
const stratOptions = STRATEGIES.map((s, i) => `<option value="${i}">${s.name}</option>`).join('');

function buildUI() {
  document.getElementById('score').innerHTML = botConfigs.map(cfg => `
    <div class="row" id="row${cfg.id}">
      <div class="dot" style="background:${cfg.color}"></div>
      <span class="bot-name" style="color:${cfg.color}">${cfg.name}</span>
      <select class="strat-select" id="sel${cfg.id}">${stratOptions}</select>
      <div class="bar"><div class="bar-fill" id="bar${cfg.id}" style="background:${cfg.color}"></div></div>
      <span class="bpct" id="pct${cfg.id}">0%</span>
    </div>`).join('');

  botConfigs.forEach(cfg => {
    const sel = document.getElementById(`sel${cfg.id}`);
    sel.value = cfg.stratIdx;
    sel.addEventListener('change', () => {
      ensureAudio();
      cfg.stratIdx = +sel.value;
      if (bots && !gameOver) bots[cfg.id - 1].stratIdx = cfg.stratIdx;
      document.getElementById(`bdesc${cfg.id}`).textContent = STRATEGIES[cfg.stratIdx].desc;
      const row = document.getElementById(`row${cfg.id}`);
      row.classList.remove('flash-row');
      void row.offsetWidth;
      row.classList.add('flash-row');
    });
  });
}

function updateUI() {
  const counts = [0,0,0,0,0];
  for (let i = 0; i < grid.length; i++) { const v = grid[i]; if (v > 0) counts[v]++; }
  let leadId = 1;
  for (let i = 2; i <= 4; i++) if (counts[i] > counts[leadId]) leadId = i;

  for (const cfg of botConfigs) {
    const bot     = bots ? bots[cfg.id - 1] : null;
    const trapped = bot && bot.trapped;
    const pct     = totalCells > 0 ? Math.round(counts[cfg.id] / totalCells * 100) : 0;
    const isLead  = cfg.id === leadId && !trapped;
    const row     = document.getElementById(`row${cfg.id}`);

    document.getElementById(`pct${cfg.id}`).textContent = trapped ? '✕' : pct + '%';
    document.getElementById(`bar${cfg.id}`).style.width = pct + '%';

    row.classList.toggle('leading', isLead);
    row.classList.toggle('trapped', trapped);

    // Colored glow on leader
    if (isLead) {
      row.style.borderColor = cfg.color + '88';
      row.style.boxShadow   = `0 0 14px ${cfg.color}33, inset 0 0 0 1px ${cfg.color}44`;
    } else {
      row.style.borderColor = '';
      row.style.boxShadow   = '';
    }
  }
}

function syncDropdowns() {
  botConfigs.forEach(cfg => {
    const sel = document.getElementById(`sel${cfg.id}`);
    if (sel) {
      sel.value = cfg.stratIdx;
      document.getElementById(`bdesc${cfg.id}`).textContent = STRATEGIES[cfg.stratIdx].desc;
    }
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// BUTTON HANDLERS
// ═══════════════════════════════════════════════════════════════════════════
const startBtn = document.getElementById('start-btn');

function setStartEnabled(enabled) {
  startBtn.disabled = !enabled;
  startBtn.textContent = enabled ? '▶ Start' : '● Running';
}

// Speed buttons
document.querySelectorAll('.speed-group .btn').forEach(btn => {
  btn.addEventListener('click', () => {
    ensureAudio();
    document.querySelectorAll('.speed-group .btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    tickMs       = +btn.dataset.ms;
    cellsPerTick = +btn.dataset.spd;
    if (running && !gameOver) {
      clearInterval(timer);
      timer = setInterval(tick, tickMs);
    }
    tone(660, 0.08, 0.15, 'sine');
  });
});

// Start
startBtn.addEventListener('click', () => {
  ensureAudio();
  startGame();
});

// Shuffle
document.getElementById('shuffle-btn').addEventListener('click', () => {
  ensureAudio();
  shuffleAllStrategies();
  resetBoard();
  syncDropdowns();
  tone(880, 0.08, 0.15, 'sine');
});

// Sound toggle
document.getElementById('sound-btn').addEventListener('click', () => {
  ensureAudio();
  soundOn = !soundOn;
  const btn = document.getElementById('sound-btn');
  btn.textContent = soundOn ? '🔊' : '🔇';
  btn.classList.toggle('muted', !soundOn);
  if (soundOn) tone(660, 0.1, 0.2, 'sine');
});

// Record
document.getElementById('rec-btn').addEventListener('click', () => {
  ensureAudio();
  if (isRecording) {
    stopRecording();
  } else {
    startRecording();
  }
});

// ═══════════════════════════════════════════════════════════════════════════
// GAME END
// ═══════════════════════════════════════════════════════════════════════════
function endGame() {
  gameOver = true;
  running  = false;
  clearInterval(timer);
  render();
  updateUI();

  const counts = [0,0,0,0,0];
  for (let i = 0; i < grid.length; i++) { const v = grid[i]; if (v > 0) counts[v]++; }
  let winId = 1;
  for (let i = 2; i <= 4; i++) if (counts[i] > counts[winId]) winId = i;

  const wCfg   = botConfigs[winId - 1];
  const pct    = Math.round(counts[winId] / totalCells * 100);
  const wStrat = STRATEGIES[wCfg.stratIdx];
  document.getElementById('msg').textContent = `${wStrat.name} wins — ${pct}% claimed!`;
  playWinner();
  setStartEnabled(true);
}

// ═══════════════════════════════════════════════════════════════════════════
// START / RESET
// ═══════════════════════════════════════════════════════════════════════════
function resetBoard() {
  clearInterval(timer);
  clearInterval(countdownTimer);
  running = false;
  gameOver = false;
  initGame();
  buildUI();
  render();
  updateUI();
  document.getElementById('msg').textContent = 'Pick strategies & press Start';
  setStartEnabled(true);
}

function startGame() {
  clearInterval(timer);
  clearInterval(countdownTimer);
  running = true;
  setStartEnabled(false);
  initGame();
  buildUI();
  render();
  updateUI();

  const msgEl = document.getElementById('msg');
  let count = 3;
  msgEl.textContent = count;
  playCountdown(count);

  countdownTimer = setInterval(() => {
    count--;
    if (count > 0) {
      msgEl.textContent = count;
      playCountdown(count);
    } else {
      msgEl.textContent = 'GO!';
      playGo();
      clearInterval(countdownTimer);
      setTimeout(() => {
        msgEl.textContent = '';
        timer = setInterval(tick, tickMs);
      }, 500);
    }
  }, 700);
}

// ═══════════════════════════════════════════════════════════════════════════
// BOOT — show idle board, wait for user to press Start
// ═══════════════════════════════════════════════════════════════════════════
initGame();
buildUI();
render();
updateUI();
setStartEnabled(true);
</script>
